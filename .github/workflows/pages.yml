# ============================================================================
# GitHub Pages への自動公開。main に push するたびに、画面を組み立てて公開する。
#   出どころ: Vite 公式の GitHub Pages 手順(vite.dev/guide/static-deploy)を元に、
#   KANSEITO 用に base と Supabase の鍵の受け渡しを足したもの(2026-09-09)。
#
# 事前に要るもの(公開手順_GitHubPages_v1.md):
#   1. リポジトリの Settings → Pages → Source を「GitHub Actions」にする
#   2. リポジトリの Settings → Secrets and variables → Actions に
#        VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY を登録する(anon は公開してよい鍵だが、念のため Secrets に置く)
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:          # Actions タブから手で動かすこともできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # https://ユーザー名.github.io/リポジトリ名/ で開くので、base は /リポジトリ名/ になる(自動)
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOWED_DOMAIN: seikou-seimitsu.com
          VITE_MOCK: '0'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
